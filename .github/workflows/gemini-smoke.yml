name: Gemini smoke test

# Disabled by default and never triggered by a push. The point of the normal
# CI suite is that it needs no credentials; this exists for the occasional
# deliberate check that the live Gemini contract has not changed underneath
# us -- which it has once already, when `gemini-2.5-flash` was retired for new
# API keys and the SDK started returning 404.
#
# To run it: Actions -> Gemini smoke test -> Run workflow. It needs a
# GEMINI_API_KEY repository secret; without one it skips rather than fails,
# so a fork never sees a red tick it cannot fix.
on:
  workflow_dispatch:

jobs:
  smoke:
    name: Live Gemini contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --extra agent

      - name: Call the model and the embedder
        working-directory: backend
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "No GEMINI_API_KEY secret configured; skipping."
            exit 0
          fi
          uv run python - <<'PY'
          from argus.agent.schemas import Narrative
          from argus.core.config import get_settings
          from google import genai
          from google.genai import types

          settings = get_settings()
          key = settings.gemini_api_key.get_secret_value()
          client = genai.Client(api_key=key)

          try:
              # Structured output is the contract that matters: the workflow
              # depends on getting fields back, not prose.
              response = client.models.generate_content(
                  model=settings.gemini_model,
                  contents="Reply with typology no_clear_typology and one claim citing evidence id 1.",
                  config=types.GenerateContentConfig(
                      response_mime_type="application/json",
                      response_schema=Narrative,
                      temperature=0.2,
                      max_output_tokens=8192,
                  ),
              )
              assert isinstance(response.parsed, Narrative), "structured output not returned"
              print(f"chat ok: {settings.gemini_model}")

              embedding = client.models.embed_content(
                  model=settings.embedding_model,
                  contents=["structuring and smurfing"],
                  config=types.EmbedContentConfig(
                      output_dimensionality=settings.embedding_dim
                  ),
              )
              dim = len(embedding.embeddings[0].values)
              assert dim == settings.embedding_dim, f"expected {settings.embedding_dim}, got {dim}"
              print(f"embeddings ok: {settings.embedding_model} ({dim}d)")
          except Exception as exc:
              # Never let a key reach the log, even in a traceback.
              raise SystemExit(f"Gemini smoke test failed: {str(exc).replace(key, '<redacted>')}") from None
          PY
