name: CI

# Every push to main and every pull request. Nothing here calls a real model
# or trains anything: the suite runs against the stub provider, so it needs no
# credentials and finishes in a couple of minutes.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run on the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      # The real database, because most of what is worth testing is SQL:
      # pgvector retrieval, the alert-budget ranking, evidence provenance.
      # SQLite could not run any of it.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus -d argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Services are published on standard ports here, unlike Compose, which
      # shifts them to avoid clashing with a developer's local install.
      DATABASE_URL: postgresql+psycopg://argus:argus@localhost:5432/argus
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      # No API key in CI. Everything runs on the deterministic stub provider,
      # which is why the suite is meaningful without credentials.
      LLM_PROVIDER: stub

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        # Both runtime extras.
        #
        # `agent` brings LangGraph and the Gemini SDK. `gnn` brings numpy,
        # torch, PyTorch Geometric and xgboost -- and it is required, not
        # optional: tests/ml and parts of tests/services import `argus.ml`,
        # which imports numpy at module scope. Without it pytest fails during
        # *collection*, so a `skipif` marker never gets the chance to run and
        # the leakage and alert-budget tests -- the most valuable in the
        # project -- silently do not execute.
        #
        # The cost is the CPU-only torch wheel, which uv caches between runs.
        # Nothing here reaches the API image: that is built from the `api`
        # Docker stage, which installs the core dependencies only.
        run: uv sync --locked --extra agent --extra gnn

      - name: Enable pgvector
        run: |
          PGPASSWORD=argus psql -h localhost -U argus -d argus \
            -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Migrate from an empty database
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Check migrations match the models
        working-directory: backend
        # Catches a model edited without a migration, which otherwise only
        # surfaces on the next deployment.
        run: uv run alembic check

      - name: Start a Celery worker
        working-directory: backend
        # The real-stack health test asserts the whole stack reports `ok`, and
        # /health reports a missing worker as an error. Without a worker here
        # that test would have to accept "degraded" -- which is exactly the
        # failure it exists to catch, so CI grows a worker rather than the
        # test growing a tolerance.
        #
        # It runs natively: this job already installs the `gnn` and `agent`
        # extras, and a worker boots light because the heavy imports live
        # inside the task bodies. No image build is needed.
        #
        # Background processes survive to later steps in the same job, so the
        # worker is still listening when pytest runs.
        run: |
          uv run celery -A argus.jobs.celery_app:celery_app worker \
            --loglevel=info --concurrency=1 > celery.log 2>&1 &
          # `inspect ping` exits non-zero until a worker answers on the broker,
          # which is the same question /health asks. Poll it rather than
          # sleeping a fixed guess.
          for _ in $(seq 1 30); do
            if uv run celery -A argus.jobs.celery_app:celery_app inspect ping -t 2; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::no Celery worker became available in 60s"
          cat celery.log
          exit 1

      - name: Test
        working-directory: backend
        # Integration tests self-skip when the Elliptic dataset is absent, and
        # it is absent here by design: it is 690 MB and downloading it on every
        # run would cost more than it proves.
        run: uv run pytest -q

      - name: Worker log
        # Only interesting when something failed: a health test that went
        # degraded is usually a worker that died after booting.
        if: failure()
        working-directory: backend
        run: cat celery.log || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint, typecheck and build
        working-directory: frontend
        # One script, the same one used locally, so CI cannot drift from what
        # a developer runs before pushing.
        run: npm run check
